# getElementById
getElementById.desc=Returns the component in the current view whose meta.domId matches the given id, just like document.getElementById in JavaScript. Only the view the script is running in is searched; embedded views, docked views and popups are not (use getPageElementById for that). Returns None if nothing matches.
getElementById.param.id=The domId to search for, as set in the component's meta.domId property.
getElementById.returns=The matching component, or None if no component in the view has that domId.

# getPageElementById
getPageElementById.desc=Returns the component on the current Perspective page whose meta.domId matches the given id. Searches the view the script is running in first, then every other view on the page (embedded views, docked views and popups). Returns None if nothing matches.
getPageElementById.param.id=The domId to search for, as set in the component's meta.domId property.
getPageElementById.returns=The matching component, or None if nothing on the page has that domId.

# getElementsById
getElementsById.desc=Returns a list of all components in the current view whose meta.domId matches the given id. Returns an empty list if nothing matches.
getElementsById.param.id=The domId to search for.
getElementsById.returns=A list of all matching components in document order.

# getPageElementsById
getPageElementsById.desc=Returns a list of all components across the entire Perspective page (including embedded views, docks and popups) whose meta.domId matches the given id.
getPageElementsById.param.id=The domId to search for.
getPageElementsById.returns=A list of all matching components on the page.

# getElementByName
getElementByName.desc=Returns the first component in the current view whose meta.name matches the given name. Runs completely in memory without property tree queue hops.
getElementByName.param.name=The component name (meta.name).
getElementByName.returns=The matching component, or None if not found.

# getPageElementByName
getPageElementByName.desc=Returns the first component on the page whose meta.name matches the given name. Searches the current view first, then other views on the page.
getPageElementByName.param.name=The component name (meta.name).
getPageElementByName.returns=The matching component, or None if not found.

# getElementsByName
getElementsByName.desc=Returns a list of all components in the current view whose meta.name matches the given name. Runs in memory with zero queue hops.
getElementsByName.param.name=The component name (meta.name).
getElementsByName.returns=A list of all matching components in document order.

# getPageElementsByName
getPageElementsByName.desc=Returns a list of all components on the page whose meta.name matches the given name.
getPageElementsByName.param.name=The component name (meta.name).
getPageElementsByName.returns=A list of all matching components across all views on the page.

# querySelector
querySelector.desc=Returns the first component in the current view matching a CSS-like selector (e.g. '#myId', 'button', 'ia.display.label', '[name="Submit"]', '.myClass', '.a.b', 'label.error, button'). Combinators, pseudo-classes and attributes other than name, domId and type are not supported and raise an error.
querySelector.param.selector=The CSS-like query selector.
querySelector.returns=The first matching component, or None if nothing matches.

# querySelectorAll
querySelectorAll.desc=Returns a list of all components in the current view matching a CSS-like selector (e.g. '#myId', 'button', 'label.warning', '[name="Submit"]'). Unsupported selector syntax raises an error rather than being ignored.
querySelectorAll.param.selector=The CSS-like query selector.
querySelectorAll.returns=A list of all matching components in document order.

# getPageQuerySelector
getPageQuerySelector.desc=Returns the first component on the page matching a CSS-like selector. Searches the current view first, then all other views on the page.
getPageQuerySelector.param.selector=The CSS-like query selector.
getPageQuerySelector.returns=The first matching component on the page, or None if nothing matches.

# getPageQuerySelectorAll
getPageQuerySelectorAll.desc=Returns a list of all components across the entire page matching a CSS-like selector.
getPageQuerySelectorAll.param.selector=The CSS-like query selector.
getPageQuerySelectorAll.returns=A list of all matching components across all views on the page.
